# Netlify への置き方。
#
# GitHub と繋いだとき、Netlify はこの札を読んで
# 「どう作って、どこを配るか」を知る。
#
#   build   … 折を一枚に束ね直す（npm run build）
#   publish … 配るのは dist フォルダ

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# 試作版（/shisaku/）は 2026年11月に第二試作版へまとめた。古い住所を開いた人は第二試作版へ移す。
# 下の「何にも当たらなければ本編を返す」札より先に置く（札は上から順に当てはめる。
# 後ろに置くと、試作版の住所を開いた人に本編が出てしまう）。
[[redirects]]
  from = "/shisaku/*"
  to = "/shisaku2/:splat"
  status = 301

[[redirects]]
  from = "/shisaku"
  to = "/shisaku2/"
  status = 301

# 住所の末尾に何も付けずに開いたら、index.html を返す
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
