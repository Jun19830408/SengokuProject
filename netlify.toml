# Netlify への置き方。
#
# GitHub と繋いだとき、Netlify はこの札を読んで
# 「どう作って、どこを配るか」を知る。
#
#   build   … 折を一枚に束ね直す（npm run build）
#   publish … 配るのは dist フォルダ

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 住所の末尾に何も付けずに開いたら、index.html を返す
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
